name: Bug report
description: Report behavior that looks incorrect or unsafe.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the exact command, policy snippet, and working directory shape if relevant.
      placeholder: |
        agent-trust decide -- rm -rf dist
        agent-trust decide -- rm -rf /
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste terminal output or redacted audit events.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: agent-trust --version
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: node --version
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 15.5, Ubuntu 24.04, etc.
