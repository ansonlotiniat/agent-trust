<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Agent Trust</title>
  <desc id="desc">A circuit breaker for AI coding agents running in dangerous mode.</desc>
  <rect width="1280" height="640" fill="#111827"/>
  <rect x="64" y="64" width="1152" height="512" rx="18" fill="#f8fafc"/>
  <rect x="104" y="104" width="1072" height="88" rx="8" fill="#0f172a"/>
  <circle cx="144" cy="148" r="10" fill="#ef4444"/>
  <circle cx="178" cy="148" r="10" fill="#f59e0b"/>
  <circle cx="212" cy="148" r="10" fill="#22c55e"/>
  <text x="256" y="158" fill="#e5e7eb" font-family="SFMono-Regular, Consolas, monospace" font-size="24">agent-trust run -- claude --dangerously-skip-permissions</text>
  <text x="104" y="280" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="800">Agent Trust</text>
  <text x="104" y="348" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="35">Keep dangerous mode on.</text>
  <text x="104" y="396" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="35">Stop catastrophic commands.</text>
  <rect x="104" y="452" width="238" height="52" rx="8" fill="#dcfce7"/>
  <text x="128" y="486" fill="#166534" font-family="SFMono-Regular, Consolas, monospace" font-size="22">rm -rf dist</text>
  <rect x="370" y="452" width="186" height="52" rx="8" fill="#fee2e2"/>
  <text x="394" y="486" fill="#991b1b" font-family="SFMono-Regular, Consolas, monospace" font-size="22">rm -rf /</text>
  <rect x="584" y="452" width="268" height="52" rx="8" fill="#fef3c7"/>
  <text x="608" y="486" fill="#92400e" font-family="SFMono-Regular, Consolas, monospace" font-size="22">cat ~/.ssh/id_rsa</text>
  <path d="M985 236l92 44v64c0 74-37 132-92 160-55-28-92-86-92-160v-64l92-44z" fill="#2563eb"/>
  <path d="M945 354l28 28 58-72" fill="none" stroke="#f8fafc" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
